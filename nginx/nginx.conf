# Single entrypoint for the whole app: dashboard, API, and every student's
# isolated terminal, all routed by name over Docker's internal DNS.
#
# IMPORTANT nginx quirk that shaped this file: when proxy_pass uses a
# variable (as everything below does, on purpose -- see below), nginx
# does NOT do its usual "replace the matched location prefix with the
# URI given in proxy_pass" rewriting. It just forwards the original
# request URI unchanged, full stop, ignoring any path you write after
# the variable. So every location below is written so the ORIGINAL
# incoming URI is already exactly what the upstream expects -- no
# rewriting relied upon.
#
# Why variables at all: they force nginx to re-resolve webapp/api/each
# workspace-<reg_no> via Docker DNS on every request instead of caching
# an IP once at startup. Without this, rebuilding webapp or api (which
# gives them a new container IP) would leave nginx proxying to a dead
# IP until nginx itself was restarted.

server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s;   # Docker's embedded DNS, used by every location below

    # Static dashboard / login / admin pages.
    # Original URI (e.g. /login.html) is forwarded unchanged -- webapp's
    # own nginx serves files at exactly those paths, so no rewrite needed.
    location / {
        set $webapp_upstream webapp;
        proxy_pass http://$webapp_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API (auth, tasks, admin) — needs cookies passed through untouched.
    # Original URI (e.g. /api/auth/login) already matches Flask's routes
    # (which are all defined under /api/...) exactly, so again: no
    # rewrite, just forward it as-is.
    location /api/ {
        set $api_upstream api;
        proxy_pass http://$api_upstream:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal-only: nginx calls this on every /terminal/ request to check
    # whether the requester's session cookie actually belongs to that
    # student (or is an admin) before proxying to a live shell.
    # "internal" means this location can ONLY be reached via auth_request
    # below -- it is not reachable directly from the browser.
    #
    # This location's own PATH is set to /api/internal/authorize-terminal
    # (matching the Flask route exactly) precisely so the "original URI
    # forwarded unchanged" rule above does the right thing here too --
    # no separate rewrite needed.
    location = /api/internal/authorize-terminal {
        internal;
        set $api_upstream api;
        proxy_pass http://$api_upstream:5000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Reg-No $reguser;
    }

    # Per-student terminal, routed to workspace-<reg_no> by Docker DNS --
    # but ONLY after auth_request confirms the caller is that student or
    # an admin. This location manually builds its own target URI via
    # $rest (not relying on any automatic prefix-rewrite), so it's
    # unaffected by the quirk described above.
    location ~ ^/terminal/(?<reguser>[A-Za-z0-9_-]+)/(?<rest>.*)$ {
        auth_request /api/internal/authorize-terminal;
        error_page 401 403 = @terminal_denied;

        set $target "workspace-$reguser:7681";

        proxy_pass http://$target/$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # keep long-lived terminal websockets open
        proxy_send_timeout 3600s;
    }

    location @terminal_denied {
        default_type text/plain;
        return 403 "Forbidden: you can only access your own terminal.\n";
    }
}
