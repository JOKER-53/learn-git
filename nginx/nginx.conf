# Single entrypoint for the whole app: dashboard, API, and every student's
# isolated terminal, all routed by name over Docker's internal DNS.

server {
    listen 80;
    server_name _;

    # Static dashboard / login / admin pages
    location / {
        proxy_pass http://webapp:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API (auth, tasks, admin) — needs cookies passed through untouched
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Per-student terminal, routed to workspace-<reg_no> by Docker DNS.
    # $reguser is validated server-side too (see workspace_manager.is_safe_reg_no),
    # but keep this regex conservative as a second line of defense.
    location ~ ^/terminal/(?<reguser>[A-Za-z0-9_-]+)/(?<rest>.*)$ {
        resolver 127.0.0.11 valid=10s;   # Docker's embedded DNS
        set $target "workspace-$reguser:7681";

        proxy_pass http://$target/$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # keep long-lived terminal websockets open
        proxy_send_timeout 3600s;
    }
}
