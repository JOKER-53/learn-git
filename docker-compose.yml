services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"     # the ONLY externally published port in production
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapp
      - api
    networks:
      default:
        aliases: []

  webapp:
    build:
      context: ./webapp
    restart: unless-stopped
    # no published ports -- only reachable through nginx
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    # no published ports -- only reachable through nginx
    environment:
      - DB_PATH=/dbdata/progress.db
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-key-change-me}
      - ADMIN_REG_NOS=${ADMIN_REG_NOS:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - DOCKER_NETWORK=learn-git_net
      - WORKSPACE_IMAGE=learn-git-workspace:latest
      # Absolute HOST path (not a path inside any container) to the
      # students-data directory. Required because api talks to the HOST
      # Docker daemon over the socket -- any bind-mount source it asks the
      # daemon to use is resolved on the host, not inside api's own
      # container. Set this in .env to an absolute path, e.g.
      # STUDENTS_HOST_PATH=/home/you/learn-git/students-data
      - STUDENTS_HOST_PATH=${STUDENTS_HOST_PATH}
    volumes:
      - progress_data:/dbdata
      - ${STUDENTS_HOST_PATH}:/data                # api gets the WHOLE tree (trusted, for validation across all students)
      - /var/run/docker.sock:/var/run/docker.sock  # lets api launch per-student containers
                                                     # SECURITY: see SECURITY.md before public deploy
    # NOTE: no depends_on for workspace-image here -- it's a profiled,
    # build-only service (see below), and api doesn't need it *running*,
    # only built beforehand: `docker compose build workspace-image`.

  # Not started by `docker compose up` -- exists only so `docker compose build`
  # produces the learn-git-workspace image, which the api then launches per
  # student (one container per reg_no) via workspace_manager.py.
  workspace-image:
    build:
      context: ./workspace
    image: learn-git-workspace:latest
    command: ["true"]
    profiles: ["build-only"]

  git-server:
    image: alpine:3.20
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache git git-daemon &&
             mkdir -p /repos &&
             git daemon --base-path=/repos --export-all --reuseaddr --verbose /repos"
    ports:
      - "9418:9418"   # git:// protocol -- exposed intentionally for clone/push/pull tasks
    volumes:
      - git_server_data:/repos

networks:
  default:
    name: learn-git_net

volumes:
  progress_data:      # accounts + task completion DB -- survives docker compose down
  git_server_data:     # bare repos for remote/push/pull tasks
