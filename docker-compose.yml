services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - default
      - no-internet
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapp
      - api
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  webapp:
    build:
      context: ./webapp
    restart: unless-stopped
    depends_on:
      - api
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/login.html"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      - DB_PATH=/dbdata/progress.db
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-key-change-me}
      - ADMIN_REG_NOS=${ADMIN_REG_NOS:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - DOCKER_NETWORK=learn-git_no_internet
      - WORKSPACE_IMAGE=learn-git-workspace:latest
      - IDLE_WORKSPACE_HOURS=${IDLE_WORKSPACE_HOURS:-24}
    volumes:
      - progress_data:/dbdata
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  workspace-image:
    build:
      context: ./workspace
    image: learn-git-workspace:latest
    command: ["true"]
    profiles: ["build-only"]

  git-server:
    image: alpine:3.20
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache git git-daemon &&
             mkdir -p /repos &&
             git daemon --base-path=/repos --export-all --reuseaddr --verbose /repos"
    ports:
      - "9418:9418"
    networks:
      - default
      - no-internet
    volumes:
      - git_server_data:/repos
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "sh", "-c", "ss -tln 2>/dev/null | grep -q :9418"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  default:
    name: learn-git_net
  no-internet:
    name: learn-git_no_internet
    internal: true

volumes:
  progress_data:
  git_server_data:
