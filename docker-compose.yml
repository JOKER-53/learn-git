version: "3.9"

services:
  webapp:
    build:
      context: ./webapp
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - WORKSPACE_REPO_PATH=/workspace-data/repo
      - DB_PATH=/data/progress.db
    volumes:
      - workspace_data:/workspace-data
      - progress_data:/data
    depends_on:
      - workspace

  workspace:
    build:
      context: ./workspace
    ports:
      - "7681:7681"   # browser terminal (ttyd)
    volumes:
      - workspace_data:/workspace-data

  git-server:
    image: alpine:3.20
    command: >
      sh -c "apk add --no-cache git openssh &&
             mkdir -p /repos &&
             git daemon --base-path=/repos --export-all --reuseaddr --verbose /repos"
    ports:
      - "9418:9418"   # git:// protocol
    volumes:
      - git_server_data:/repos

volumes:
  workspace_data:      # student's repo state — survives docker compose down
  progress_data:        # task completion DB — survives docker compose down
  git_server_data:       # bare repos for remote/push/pull tasks
