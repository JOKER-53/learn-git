<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>learn-git — reset password</title>
<style>
  :root { --bg:#0d1117; --panel:#11161d; --border:#30363d; --text:#c9d1d9; --muted:#8b949e; --green:#2ea043; --red:#f85149; --yellow:#e3b341; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); margin: 0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 12px; padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 span { color: var(--green); }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; line-height: 1.5; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 14px; text-transform: none;
  }
  input:focus { outline: none; border-color: var(--green); }
  button {
    width: 100%; margin-top: 22px; padding: 10px; background: var(--green); color: white;
    border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: var(--border); cursor: not-allowed; }
  .back { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: center; }
  .back a { color: var(--green); text-decoration: none; }
  .error { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }

  .recovery-box {
    display: none; margin-top: 16px; padding: 14px; background: #1c1500;
    border: 1px solid var(--yellow); border-radius: 8px;
  }
  .recovery-box .label { font-size: 11px; color: var(--yellow); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .recovery-box code {
    display: block; font-size: 18px; letter-spacing: 0.05em; color: #fff;
    background: #0d1117; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 8px;
  }
  .recovery-box p { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.5; }
  .recovery-box button { margin-top: 12px; background: var(--yellow); color: #1c1500; }
</style>
</head>
<body>
<div class="card">
  <h1>learn<span>-git</span></h1>
  <p class="sub">Reset your password using the recovery code you saved when you registered. No code? Ask an admin to reset your account instead.</p>

  <form id="reset-form">
    <label for="reg_no">Registration Number</label>
    <input id="reg_no" name="reg_no" type="text" required placeholder="e.g. 21CS045">

    <label for="recovery_code">Recovery Code</label>
    <input id="recovery_code" name="recovery_code" type="text" required placeholder="XXXX-XXXX">

    <label for="new_password">New Password</label>
    <input id="new_password" name="new_password" type="password" required minlength="6">

    <div class="error" id="error-box"></div>
    <button type="submit" id="submit-btn">Reset password</button>
  </form>

  <div class="recovery-box" id="recovery-box">
    <div class="label">Your new recovery code</div>
    <code id="new-recovery-code"></code>
    <p>Your old code no longer works. Save this new one — you'll need it next time.</p>
    <button id="recovery-continue">Continue to sign in</button>
  </div>

  <div class="back" id="back-row">
    <a href="login.html">Back to sign in</a>
  </div>
</div>

<script>
const API = "";
const form = document.getElementById("reset-form");
const submitBtn = document.getElementById("submit-btn");
const errorBox = document.getElementById("error-box");
const recoveryBox = document.getElementById("recovery-box");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.style.display = "none";
  submitBtn.disabled = true;
  submitBtn.innerText = "Resetting...";

  const reg_no = document.getElementById("reg_no").value.trim();
  const recovery_code = document.getElementById("recovery_code").value.trim();
  const new_password = document.getElementById("new_password").value;

  try {
    const res = await fetch(`${API}/api/auth/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reg_no, recovery_code, new_password })
    });
    const data = await res.json();

    if (!res.ok) {
      errorBox.innerText = data.error || "Something went wrong";
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.innerText = "Reset password";
      return;
    }

    form.style.display = "none";
    document.getElementById("back-row").style.display = "none";
    document.getElementById("new-recovery-code").innerText = data.new_recovery_code;
    recoveryBox.style.display = "block";
  } catch (err) {
    errorBox.innerText = "Could not reach the server.";
    errorBox.style.display = "block";
    submitBtn.disabled = false;
    submitBtn.innerText = "Reset password";
  }
});

document.getElementById("recovery-continue").addEventListener("click", () => {
  window.location.href = "login.html";
});
</script>
</body>
</html>
